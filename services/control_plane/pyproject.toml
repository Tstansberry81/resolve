[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolve-control-plane"
version = "0.5.0"
description = "Durable goal orchestration and policy control plane for RESOLVE"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=5.2,<6",
  "httpx>=0.28,<1",
  "structlog>=25.1,<26",
  "requests>=2.32,<3",
  "anthropic>=0.40",
  "openai>=1.50,<3",
  "google-auth>=2.35,<3",
  "google-api-python-client>=2.150,<3",
  "anyio>=4,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_control_plane"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

# Pin the rule set explicitly. Without this, ruff falls back to whatever its
# CURRENT defaults are, and CI installs the newest ruff on every run — so a ruff
# release that widens the defaults turns CI red with no code change. That is
# exactly what happened: `ruff check src tests` failed on every commit for weeks
# (198 findings under 0.16, zero under the older pin) while the code was fine.
#
# E4/E7/E9 + F is ruff's own documented default and what this repo was passing
# before the drift. Widening it is a deliberate decision to make on purpose, not
# something a dependency upgrade should do silently.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
